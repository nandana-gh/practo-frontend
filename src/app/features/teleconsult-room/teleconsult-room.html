<div class="container-fluid h-100 p-0 overflow-hidden bg-light">
  <!-- Top Navigation Bar for Consult -->
  <div class="bg-white shadow-sm d-flex align-items-center justify-content-between px-4 py-3" style="z-index: 1000; position: relative;">
    <div class="d-flex align-items-center gap-3">
      <a routerLink="/" class="text-decoration-none text-dark d-flex align-items-center">
        <i class="bi bi-arrow-left fs-5"></i>
      </a>
      <div>
        <h5 class="mb-0 fw-bold">Teleconsultation Room</h5>
        <small class="text-muted">Appointment ID: #{{ appointmentId }}</small>
      </div>
    </div>
    <button class="btn btn-danger btn-sm" (click)="endConsultation()">
      <i class="bi bi-telephone-x me-2"></i> End Call
    </button>
  </div>

  <div class="row g-0 h-100" style="height: calc(100vh - 72px) !important;">
    <!-- Jitsi Video Call Area (Left) -->
    <div class="col-lg-8 col-md-7 h-100 position-relative bg-dark">
      <iframe 
        [src]="jitsiUrl" 
        allow="camera; microphone; fullscreen; display-capture; autoplay" 
        style="width: 100%; height: 100%; border: none;">
      </iframe>
    </div>

    <!-- Chat and Prescription Panel (Right) -->
    <div class="col-lg-4 col-md-5 h-100 d-flex flex-column bg-white border-start">
      
      <!-- Tabs -->
      <ul class="nav nav-tabs nav-fill border-bottom-0 shadow-sm" style="z-index: 10;">
        <li class="nav-item">
          <a class="nav-link cursor-pointer rounded-0 py-3" [class.active]="activeTab === 'chat'" (click)="activeTab = 'chat'">
            <i class="bi bi-chat-dots me-2"></i>Live Chat
          </a>
        </li>
        <li class="nav-item" *ngIf="isDoctor">
          <a class="nav-link cursor-pointer rounded-0 py-3" [class.active]="activeTab === 'rx'" (click)="activeTab = 'rx'">
            <i class="bi bi-file-medical me-2"></i>Prescription
          </a>
        </li>
      </ul>

      <!-- Chat Area -->
      <div *ngIf="activeTab === 'chat'" class="d-flex flex-column h-100">
        <!-- Message List -->
        <div class="flex-grow-1 overflow-auto p-4" style="background-color: #f8f9fa;">
          <div *ngIf="(messages$ | async)?.length === 0" class="text-center text-muted mt-5">
            <i class="bi bi-chat-quote fs-1 text-light"></i>
            <p class="mt-2">No messages yet. Send a message to start chatting.</p>
          </div>
          
          <div *ngFor="let msg of messages$ | async" class="mb-3 d-flex flex-column" [ngClass]="{'align-items-end': msg.senderId === currentUserId, 'align-items-start': msg.senderId !== currentUserId}">
            <div class="p-3 rounded-3 shadow-sm" [ngClass]="{'bg-primary text-white': msg.senderId === currentUserId, 'bg-white text-dark': msg.senderId !== currentUserId}" style="max-width: 85%;">
              <p class="mb-1">{{ msg.message }}</p>
            </div>
            <small class="text-muted mt-1" style="font-size: 11px;">{{ msg.sentAt | date:'shortTime' }}</small>
          </div>
        </div>

        <!-- Chat Input -->
        <div class="p-3 bg-white border-top">
          <div class="input-group">
            <input type="text" class="form-control" placeholder="Type a message..." [(ngModel)]="newMessage" (keyup.enter)="sendMessage()">
            <button class="btn btn-primary" type="button" (click)="sendMessage()">
              <i class="bi bi-send"></i>
            </button>
          </div>
        </div>
      </div>

      <!-- Prescription Area (Doctor Only) -->
      <div *ngIf="activeTab === 'rx' && isDoctor" class="d-flex flex-column h-100 p-4 overflow-auto">
        <div class="alert alert-info rounded-3">
          <i class="bi bi-info-circle me-2"></i> Issue an electronic prescription for this consultation.
        </div>
        
        <div class="mb-3">
          <label class="form-label fw-bold">Medications prescribed</label>
          <textarea class="form-control" rows="5" placeholder="e.g. Paracetamol 500mg - 1-0-1 for 3 days..." [(ngModel)]="prescriptionMedications"></textarea>
        </div>
        <div class="mb-4">
          <label class="form-label fw-bold">Special Instructions</label>
          <textarea class="form-control" rows="3" placeholder="Take after food..." [(ngModel)]="prescriptionInstructions"></textarea>
        </div>

        <button class="btn btn-success mt-auto py-2" (click)="submitPrescription()" [disabled]="!prescriptionMedications || isSubmittingRx">
          <span *ngIf="isSubmittingRx" class="spinner-border spinner-border-sm me-2"></span>
          Issue Prescription
        </button>
      </div>

    </div>
  </div>
</div>
