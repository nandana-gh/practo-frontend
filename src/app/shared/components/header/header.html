<nav class="navbar navbar-expand-lg navbar-light bg-white border-bottom py-3 sticky-top">
  <div class="container">
    <!-- Brand Logo -->
    <a class="navbar-brand d-flex align-items-center" routerLink="/">
      <svg width="36" height="36" viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg" class="me-2">
        <rect width="36" height="36" rx="8" fill="#263077"/>
        <path d="M18 9V27M9 18H27" stroke="#2CB7DF" stroke-width="4" stroke-linecap="round"/>
      </svg>
      <span class="fs-4 fw-extrabold tracking-tight" style="color: #263077; font-family: 'Inter', sans-serif;">practo</span>
    </a>

    <!-- Mobile Toggle -->
    <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse" data-bs-target="#practoNavbar" aria-controls="practoNavbar" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <!-- Navbar Links -->
    <div class="collapse navbar-collapse" id="practoNavbar">
      <ul class="navbar-nav me-auto mb-2 mb-lg-0 ms-lg-4 gap-2">
        <li class="nav-item">
          <a class="nav-link fw-semibold" routerLink="/search" routerLinkActive="active" [routerLinkActiveOptions]="{exact: false}">Find Doctors</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" routerLink="/video-consult" routerLinkActive="active">Video Consult</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" routerLink="/medicines" routerLinkActive="active">Medicines</a>
        </li>
        <li class="nav-item">
          <a class="nav-link fw-semibold" routerLink="/labs" routerLinkActive="active">Lab Tests</a>
        </li>
      </ul>

      <!-- User Auth Section -->
      <div class="d-flex align-items-center">
        <ng-container *ngIf="authService.isAuthenticated(); else guestView">
          <div class="dropdown">
            <button class="btn btn-outline-practo-blue dropdown-toggle d-flex align-items-center gap-2 py-2 px-3" type="button" id="userMenuButton" data-bs-toggle="dropdown" aria-expanded="false">
              <i class="bi bi-person-circle fs-5"></i>
              <span>{{ authService.currentUser()?.firstName }}</span>
            </button>
            <ul class="dropdown-menu dropdown-menu-end shadow-sm border-0 mt-2" aria-labelledby="userMenuButton">
              <li>
                <div class="px-3 py-2 border-bottom">
                  <span class="d-block fw-bold text-dark">{{ authService.currentUser()?.firstName }} {{ authService.currentUser()?.lastName }}</span>
                  <span class="d-block small text-muted">{{ authService.currentUser()?.email }}</span>
                  <span class="badge bg-light text-dark mt-1 border">{{ authService.currentUser()?.role }}</span>
                </div>
              </li>
              <li><a class="dropdown-menu-item dropdown-item py-2 px-3" routerLink="/dashboard"><i class="bi bi-grid-1x2 me-2"></i>My Dashboard</a></li>
              <li><a class="dropdown-menu-item dropdown-item py-2 px-3" routerLink="/records"><i class="bi bi-file-earmark-medical me-2"></i>Medical Records</a></li>

                <button class="dropdown-item py-2 px-3 text-danger" (click)="logout()">
                  <i class="bi bi-box-arrow-right me-2"></i>Logout
                </button>
              </li>
            </ul>
          </div>

        <ng-template #guestView>
          <a class="btn btn-outline-practo-blue py-2 px-4 me-2 rounded" routerLink="/login">Login / Signup</a>
        </ng-template>
      </div>
    </div>
  </div>
</nav>
