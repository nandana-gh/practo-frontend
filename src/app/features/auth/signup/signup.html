

<div class="container my-5 py-3">
  <div class="row justify-content-center align-items-center g-5">
    
    <!-- Left Column: Planet Illustration -->
    <div class="col-12 col-md-5 col-lg-5 text-center d-none d-md-block">
      <svg width="100%" viewBox="0 0 400 400" fill="none" xmlns="http://www.w3.org/2000/svg" class="planet-illustration" style="height: auto;">
        <circle cx="200" cy="200" r="160" fill="url(#planetGlow)" opacity="0.08"/>
        <circle cx="100" cy="120" r="4" fill="#2CB7DF"/>
        <circle cx="310" cy="180" r="3" fill="#ea8d35"/>
        <circle cx="280" cy="80" r="5" fill="#263077" opacity="0.3"/>
        <path d="M70 210 C 70 235, 330 235, 330 210" stroke="#7e4ffc" stroke-width="8" stroke-linecap="round" opacity="0.8"/>
        <circle cx="200" cy="200" r="90" fill="#2CB7DF"/>
        <path d="M140 180 C 170 160, 230 220, 260 200" stroke="#229cb0" stroke-width="6" stroke-linecap="round" opacity="0.4"/>
        <path d="M150 220 C 180 200, 220 240, 250 220" stroke="#229cb0" stroke-width="4" stroke-linecap="round" opacity="0.3"/>
        <g transform="translate(115, 235)">
          <rect x="0" y="0" width="50" height="60" rx="4" fill="#ea8d35"/>
          <rect x="15" y="45" width="20" height="15" fill="#ffffff" rx="1"/>
          <rect x="8" y="10" width="10" height="10" fill="#ffffff" opacity="0.8"/>
          <rect x="32" y="10" width="10" height="10" fill="#ffffff" opacity="0.8"/>
          <rect x="8" y="28" width="10" height="10" fill="#ffffff" opacity="0.8"/>
          <rect x="32" y="28" width="10" height="10" fill="#ffffff" opacity="0.8"/>
          <path d="M25 48 V 57 M 21 52 H 29" stroke="#ea8d35" stroke-width="2"/>
        </g>
        <g transform="translate(240, 240)">
          <rect x="0" y="10" width="50" height="25" rx="3" fill="#2CB7DF"/>
          <rect x="35" y="0" width="15" height="15" fill="#2CB7DF"/>
          <rect x="10" y="5" width="10" height="10" fill="#ffffff" opacity="0.6"/>
          <circle cx="12" cy="35" r="8" fill="#282c3f"/>
          <circle cx="38" cy="35" r="8" fill="#282c3f"/>
          <path d="M25 15 V 25 M 20 20 H 30" stroke="#ffffff" stroke-width="2"/>
        </g>
        <g transform="translate(110, 110)">
          <circle cx="20" cy="20" r="18" fill="#263077"/>
          <path d="M12 20 C 12 25, 28 25, 28 20" stroke="#2CB7DF" stroke-width="3" fill="none"/>
          <path d="M20 22 V 32" stroke="#2CB7DF" stroke-width="3"/>
          <circle cx="20" cy="32" r="4" fill="#ffffff"/>
        </g>
        <g transform="translate(190, 85)">
          <circle cx="20" cy="20" r="18" fill="#7e4ffc"/>
          <path d="M20 10 C 15 10, 12 13, 12 18 C 12 24, 20 28, 20 30 C 20 28, 28 24, 28 18 C 28 13, 25 10, 20 10 Z" fill="#ffffff"/>
        </g>
        <g transform="translate(260, 115)">
          <rect x="0" y="0" width="36" height="36" rx="4" fill="#2cb7df"/>
          <circle cx="18" cy="14" r="6" fill="#ffffff"/>
          <path d="M8 28 C 8 22, 28 22, 28 28" fill="#ffffff"/>
        </g>
        <path d="M330 210 C 330 185, 70 185, 70 210" stroke="#7e4ffc" stroke-width="8" stroke-linecap="round"/>
        <g transform="translate(300, 150) rotate(30)">
          <rect x="0" y="0" width="24" height="10" rx="5" fill="#ea8d35"/>
          <rect x="12" y="0" width="12" height="10" fill="#ffffff" rx="1"/>
        </g>
        <g transform="translate(90, 185) rotate(-45)">
          <rect x="0" y="0" width="24" height="10" rx="5" fill="#263077"/>
          <rect x="12" y="0" width="12" height="10" fill="#2CB7DF" rx="1"/>
        </g>
        <defs>
          <radialGradient id="planetGlow" cx="200" cy="200" r="1">
            <stop offset="0%" stop-color="#2CB7DF"/>
            <stop offset="100%" stop-color="#263077" stop-opacity="0"/>
          </radialGradient>
        </defs>
      </svg>
    </div>

    <!-- Right Column: Form Container -->
    <div class="col-12 col-md-7 col-lg-5">
      <!-- Tabs Header -->
      <div class="d-flex justify-content-center border-bottom mb-4 auth-tabs">
        <a class="auth-tab" routerLink="/login">Login</a>
        <a class="auth-tab active" routerLink="/signup">Register</a>
      </div>

      <!-- Register Card -->
      <div class="card auth-card border p-4 bg-white">
        <div class="card-body">
          <!-- Card Header Panel -->
          <div class="d-flex justify-content-between align-items-center mb-3">
            <h5 class="fw-bold mb-0" style="color: #282c3f; font-size: 17px;">Join Practo</h5>
            <a routerLink="/providers/profile" class="small text-decoration-none fw-semibold cursor-pointer" style="color: #df8926;">Are you a doctor? <span style="text-decoration: underline;">Register Here</span></a>
          </div>

          <!-- Error Message Alert -->
          <div *ngIf="errorMessage" class="alert alert-danger border-0 small py-2 rounded mb-3" role="alert">
            <i class="bi bi-exclamation-triangle-fill me-2"></i>
            {{ errorMessage }}
          </div>

          <!-- Register Form -->
          <form (ngSubmit)="onSubmit()" #signupForm="ngForm">
            <!-- Role Selection -->
            <div class="mb-3">
              <label for="role" class="form-label small text-muted fw-semibold">Register As</label>
              <select class="form-select auth-input" id="role" name="role" [(ngModel)]="role">
                <option [ngValue]="0">Patient</option>
                <option [ngValue]="1">Doctor</option>
              </select>
            </div>

            <!-- Full Name Input -->
            <div class="mb-3">
              <label for="fullName" class="form-label small text-muted fw-semibold">Full Name</label>
              <input type="text" class="form-control auth-input" id="fullName" name="fullName" [(ngModel)]="fullName" required placeholder="Full Name">
            </div>

            <!-- Email Address Input -->
            <div class="mb-3">
              <label for="email" class="form-label small text-muted fw-semibold">Email Address</label>
              <input type="email" class="form-control auth-input" id="email" name="email" [(ngModel)]="email" required placeholder="Email Address">
            </div>

            <!-- Phone Number Input -->
            <div class="mb-3">
              <label for="phone" class="form-label small text-muted fw-semibold">Phone Number</label>
              <input type="text" class="form-control auth-input" id="phone" name="phone" [(ngModel)]="phoneNumber" required placeholder="Mobile Number">
            </div>

            <!-- Doctor Specific Fields -->
            <ng-container *ngIf="role === 1">
              <div class="row">
                <div class="col-6 mb-3">
                  <label for="exp" class="form-label small text-muted fw-semibold">Experience (Years)</label>
                  <input type="number" class="form-control auth-input" id="exp" name="exp" [(ngModel)]="experienceYears" required min="0" placeholder="e.g. 5">
                </div>
                <div class="col-6 mb-3">
                  <label for="fee" class="form-label small text-muted fw-semibold">Consultation Fee</label>
                  <input type="number" class="form-control auth-input" id="fee" name="fee" [(ngModel)]="videoConsultationFee" required min="0" placeholder="₹ Amount">
                </div>
              </div>
            </ng-container>

            <!-- Create Password Input -->
            <div class="mb-3">
              <label for="password" class="form-label small text-muted fw-semibold">Create Password</label>
              <input type="password" class="form-control auth-input" id="password" name="password" [(ngModel)]="password" required placeholder="Password">
            </div>

            <!-- Receive Offers Checkbox -->
            <div class="form-check mb-2">
              <input type="checkbox" class="form-check-input" id="offersCheck" checked>
              <label class="form-check-label small text-muted" for="offersCheck" style="font-size: 12px; line-height: 1.4;">
                Receive relevant offers and promotional communication from Practo
              </label>
            </div>

            <!-- Terms label -->
            <p class="small text-muted mb-4" style="font-size: 11px;">By signing up, I agree to <a href="#" class="text-decoration-none" style="color: #00a6e2;">terms</a></p>

            <!-- Submit Button -->
            <button type="submit" class="btn btn-login-submit w-100 py-2 fw-bold text-white" [disabled]="isLoading">
              <span *ngIf="isLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
              {{ isLoading ? 'Sending OTP...' : 'Send OTP' }}
            </button>
          </form>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Email OTP Verification Modal Overlay -->
<div *ngIf="showOtpModal" class="modal-backdrop fade show"></div>
<div *ngIf="showOtpModal" class="modal fade show d-block" tabindex="-1" role="dialog" style="top: 15%;">
  <div class="modal-dialog modal-dialog-centered" role="document">
    <div class="modal-content border-0 shadow-lg p-3 rounded-3">
      <div class="modal-header border-0 pb-0">
        <h5 class="modal-title fw-bold" style="color: #263077;"><i class="bi bi-shield-lock me-2"></i>Email Verification</h5>
        <button type="button" class="btn-close" (click)="closeOtpModal()" aria-label="Close"></button>
      </div>
      <div class="modal-body py-3">
        <p class="text-muted small">We've sent a 6-digit OTP code to <strong class="text-dark">{{ email }}</strong>. Enter it below to complete verification.</p>
        
        <div *ngIf="otpError" class="alert alert-danger border-0 small py-2 rounded" role="alert">
          {{ otpError }}
        </div>

        <div class="mb-3">
          <label for="otpCode" class="form-label small fw-semibold text-muted">Enter 6-Digit OTP</label>
          <input type="text" maxlength="6" class="form-control form-control-lg text-center fw-bold tracking-widest py-2 fs-5" id="otpCode" name="otpCode" [(ngModel)]="otpCode" placeholder="000000">
        </div>
      </div>
      <div class="modal-footer border-0 pt-0 gap-2">
        <button type="button" class="btn btn-light px-3 py-2" (click)="closeOtpModal()">Cancel</button>
        <button type="button" class="btn btn-practo-turquoise px-4 py-2" (click)="onVerifyOtp()" [disabled]="otpLoading">
          <span *ngIf="otpLoading" class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
          Verify & Sign Up
        </button>
      </div>
      <div class="text-center pb-2">
        <button type="button" class="btn btn-link small text-decoration-none fw-semibold p-0" style="color: #2cb7df;" (click)="onResendOtp()">Resend OTP</button>
      </div>
    </div>
  </div>
</div>

<app-footer></app-footer>
