<!-- Main Practo Banner -->
<div class="bg-light w-100 py-5 border-bottom position-relative overflow-hidden" style="min-height: 380px;">
  <!-- Background Pattern placeholder -->
  <div class="position-absolute top-0 start-0 w-100 h-100" style="background: linear-gradient(135deg, #f6f8fc 0%, #e9edf5 100%); z-index: 0;"></div>
  
  <div class="container position-relative" style="z-index: 1;">
    <div class="row align-items-center">
      <div class="col-lg-6">
        <h1 class="fw-bold mb-3" style="font-size: 2.5rem; color: #1a1a1a;">Healthcare when you need it.</h1>
        <p class="text-secondary fs-5 mb-4">Find doctors, clinics, hospitals, and more.</p>
        
        <!-- Large Search Bar -->
        <div class="bg-white rounded-3 shadow-sm d-flex align-items-center p-2 mb-4 w-100" style="max-width: 600px;">
          <div class="d-flex align-items-center px-3 border-end w-50">
            <i class="bi bi-geo-alt-fill text-muted me-2"></i>
            <input type="text" class="form-control border-0 shadow-none px-0" placeholder="Bangalore">
          </div>
          <div class="d-flex align-items-center px-3 w-50">
            <i class="bi bi-search text-muted me-2"></i>
            <input type="text" class="form-control border-0 shadow-none px-0" placeholder="Search doctors, clinics, hospitals, etc.">
          </div>
        </div>
      </div>
      <div class="col-lg-6 d-none d-lg-block text-end">
        <img src="https://www.practostatic.com/consumer-home/desktop/images/1597423628/dweb_hero_banner.png" alt="Hero Banner" class="img-fluid" style="max-height: 280px; object-fit: contain;">
      </div>
    </div>
  </div>
</div>

<!-- Services Cards Section -->
<div class="container py-5">
  <div class="row g-4">
    <div class="col-md-4" *ngFor="let service of services">
      <div class="card h-100 border-0 rounded-4 shadow-sm service-card cursor-pointer text-decoration-none" [routerLink]="service.route" [ngClass]="service.bgClass">
        <div class="card-body p-4 text-center d-flex flex-column align-items-center justify-content-between">
          <div>
            <img [src]="service.image" [alt]="service.title" class="img-fluid mb-4" style="max-height: 120px;">
            <h4 class="fw-bold text-dark mb-1">{{ service.title }}</h4>
            <p class="text-secondary mb-0">{{ service.subtitle }}</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
